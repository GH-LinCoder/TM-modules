<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organise</title>
  <!-- Use Tailwind CDN properly -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!--script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script-->
     <link id="app-favicon" rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css" id="main-styles">
  <script type="module" src="flexmain.js" id="main-script"></script>
  



  <style>
  header[data-panel="nav-header"] {
    height: auto !important;
    flex: 0 0 auto !important;
  }
.debug * {
  outline: 1px solid red;
}


  </style>
</head>

<body class="flex flex-col h-screen bg-gray-50">


  <div id="tm-app" class="flex flex-col w-full h-full" data-app="tm-app" data-module="flexload"  data-destination="new-panel"><!-- module here as default. If a new module opens in a panel the 'petition' reading needs to find a module somewhere. -->

    <!-- Top Navigation -->
<header class="bg-blue-100 border-b border-gray-200 p-1 md:p-4" data-panel="nav-header">
  <div class="flex flex-wrap items-center p-1 md:p-4" data-section="menu">

    <!-- Logo -->
    <h1 class="text-2xl font-bold text-gray-800">
      <img id="main-logo" src="./favicon.ico" alt="T&M logo" class="h-10 w-auto" />
    </h1>

    <!-- Desktop menu (unchanged layout, only hidden on mobile) -->
    <nav class="hidden md:flex gap-2 flex-wrap" data-nav="main-nav">

      <span id="env-label" class="like-nav-btn">Default Label</span>

      <button class="nav-btn active bg-green-100" data-page="adminDash" title="Admin dashboard to build appros, surveys & tasks,and to build structure by relating appros, and assign tasks and surveys">Build <span class="text-xs italic">admin</span></button>
      <button class="nav-btn bg-green-100" data-page="myDash" data-action="myDash" title="The tasks I am handling, the surveys where I give my opinion and make choices, and where I recruit others">Say & Do <span class="text-xs italic">my dash</span></button>
      <button class="nav-btn bg-green-100" data-page="runDash" data-action="runDash" title="If I am a manger this is where I manage appros, surveys & tasks, and see what I have been assigned and related to.">Run <span class="text-xs italic">manage</span></button>
      <button class="nav-btn" data-page="howTo" title="This is where context related help is to be made available when implemented" data-action="howTo">How?</button>
      <button class="nav-btn" data-page="selector-dialogue" title="Choose the items you need to load into admin modules" data-action="selector-dialogue">Select</button>
      <button class="nav-btn" data-page="bug-report" title="Send messages, make notes for yourself, or report bugs" data-action="bug-report">Messages <span class="text-xs italic" >Bug Report</span></button>
      <button class="nav-btn" data-page="login-signup" title="If data doesn't load you may need to login again using this module." data-action="login-signup">Login</button>

      <button class="nav-btn" data-page="privacy" title="The apps statement on data protection" data-action="privacy "><span class="text-xs italic">Privacy</span></button>

    </nav>

    <!-- Mobile hamburger (only visible on mobile) -->
    <button id="hamburgerButton" class="md:hidden text-3xl p-2">
      ☰
    </button>

  </div>

  <!-- Mobile menu (hidden by default) -->
  <nav id="mobileMenu" class="hidden flex-col gap-2 mt-4 md:hidden" data-nav="main-nav">

    <span id="env-label-mobile" class="like-nav-btn">Default Label</span>

    <button class="nav-btn active" data-page="adminDash">Admin</button>
    <button class="nav-btn" data-page="myDash" data-action="myDash">My Dash</button>
    <button class="nav-btn" data-page="howTo" data-action="howTo">How?</button>
    <button class="nav-btn" data-page="selector-dialogue" data-action="selector-dialogue">Select</button>
    <button class="nav-btn" data-page="bug-report" data-action="bug-report">Messages / Bug Report</button>
    <button class="nav-btn" data-page="privacy" data-action="privacy">Privacy</button>
    <button class="nav-btn" data-page="login-signup" data-action="login-signup">Login/Signup</button>

  </nav>
</header>



    <!-- Main Content Area   removing overflow-hidden in hope this is source of bug of unresponsive dropdowns WRECKED THE APP-->
    <main id="main-container" class="flex-1 overflow-y-auto md:overflow-hidden" data-panel="the-frame-around-the-pages">
    
<!-- Mobile-only injection point: appears at the top, above the dashboard   added 20:20 Aug 27-->
<section id="mobile-panel" 
  class="hidden md:hidden w-full p-2 bg-gray-50 border-b border-gray-300" 
  data-panel="mobile-inject-here">
</section>

      <!--section id="primary-panel" class="flex flex-row flex-1 overflow-x-auto p-2 md:p-4 bg-gray-50" data-panel="inject-here"-->
      <section id="primary-panel"
  class="flex flex-row flex-1 w-full min-w-0 overflow-x-auto p-0 md:p-4 bg-gray-50"
  data-panel="inject-here">

        <!-- Dynamic content will be injected here -->
      </section>
    </main>

  </div>

  <script type="module">
document.getElementById('hamburgerButton').addEventListener('click', () => {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('hidden');
});

  </script>
</body>
</html>
